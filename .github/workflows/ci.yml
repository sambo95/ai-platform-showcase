name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: llm-gateway
            dir: projects/llm-inference-k8s/gateway
          - name: rag-platform
            dir: projects/rag-platform
          - name: ops-agent
            dir: projects/ops-agent
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  rag-eval:
    name: retrieval quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rag-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/rag-platform/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Fail if recall@3 or MRR regress
        run: python -m eval.run_eval --k 3 --min-recall 0.9 --min-mrr 0.8 | tee "$GITHUB_STEP_SUMMARY"

  manifests:
    name: render and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Kustomize build + schema validation
        run: |
          set -euo pipefail
          for dir in \
            projects/llm-inference-k8s/deploy/overlays/local \
            projects/llm-inference-k8s/deploy/overlays/gpu \
            projects/llm-inference-k8s/deploy/observability \
            projects/rag-platform/deploy
          do
            echo "::group::$dir"
            # CRDs (KEDA, Prometheus Operator) have no built-in schema; skip those only.
            kubectl kustomize "$dir" | kubeconform -strict -summary -ignore-missing-schemas
            echo "::endgroup::"
          done
          kubeconform -strict -summary projects/ops-agent/deploy/rbac.yaml

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-inference-k8s/terraform/oke
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [python, rag-eval, manifests]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: llm-gateway
            context: projects/llm-inference-k8s/gateway
          - name: rag-api
            context: projects/rag-platform
          - name: ops-agent
            context: projects/ops-agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase owner for the registry path
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Pull requests build to prove the Dockerfile works; only main publishes.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
