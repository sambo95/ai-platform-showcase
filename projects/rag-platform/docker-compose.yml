# Local stack: Qdrant + the RAG API. Point RAG_LLM_URL at any OpenAI-compatible
# endpoint; by default it targets the llm-inference-k8s gateway on localhost:8000.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

  rag:
    build: .
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_LLM_URL: ${RAG_LLM_URL:-http://host.docker.internal:8000}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-default}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - qdrant

volumes:
  qdrant-data:
