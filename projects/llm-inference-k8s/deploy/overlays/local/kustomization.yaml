apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
  - namespace.yaml
  - ../../base
  - ../../model-cpu
images:
  - name: llm-gateway
    newName: llm-gateway
    newTag: dev
patches:
  # One replica and a NodePort that kind maps to localhost:8000.
  - target:
      kind: Deployment
      name: llm-gateway
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: llm-gateway
    patch: |
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
