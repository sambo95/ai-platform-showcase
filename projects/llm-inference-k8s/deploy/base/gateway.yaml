apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: llm-gateway
      containers:
        - name: gateway
          image: llm-gateway
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: GATEWAY_UPSTREAM_URL
              value: http://model-server:8080
            - name: GATEWAY_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-keys
                  key: api-keys
                  optional: true
          envFrom:
            - configMapRef:
                name: llm-gateway-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
